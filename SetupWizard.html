<!--
  Setup wizard shown as a dialog OVER the Google Sheet (SpreadsheetApp.getUi().
  showModalDialog), not inside the web app. This is what lets setup happen
  before any web app deployment exists — a brand-new copy has no URL to open
  yet, so the wizard has to live somewhere reachable without one, and the
  Sheet itself is the only thing guaranteed to be open already.

  Self-contained on purpose: this file duplicates the wizard step logic that
  also lives in Index.html (used when someone deploys by hand first and hits
  setup from the web app instead — see wizStart() there). Sharing the code
  across both would need Apps Script's HtmlService templating + an include()
  helper, which means an extra file for a developer to keep straight during
  manual copy-paste deployment, for logic that is a few hundred lines and
  changes rarely. Duplication was the deliberate tradeoff. If you change a
  step here, check whether Index.html's copy needs the same change.
-->
<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  /* ── W-01 · EL BOTÓN QUE CONTINÚA NO SE PUEDE ESCONDER ────────────────────
     Jose, 9/11, con captura del primer paso: *"la ventana de setup debe
     siempre ser suficientemente grande para que no se tenga que hacer scroll;
     si no se puede, entonces hay que mover el botón de Continue más arriba."*

     La altura de esta ventana NO la decidimos nosotros: la pone
     `showModalDialog`, y la recorta el navegador si la pantalla es más baja.
     O sea que «hacerla más grande» no es una garantía que podamos dar — en un
     portátil de 13 pulgadas vuelve a no caber.

     Así que se hace lo segundo, que sí es una garantía: la ventana es una
     columna de tres piezas. La cabecera arriba, el PIE ABAJO SIEMPRE, y sólo
     el contenido del medio se desplaza. El botón que continúa la instalación
     no puede quedar fuera de la pantalla, mida lo que mida la ventana. */
  html,body{height:100%}
  body{margin:0;padding:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:#fff;color:#111827;
       display:flex;flex-direction:column;overflow:hidden}
  .wiz-head{padding:1.5rem 1.5rem .25rem;flex-shrink:0}
  .wiz-scroll{flex:1 1 auto;overflow-y:auto;padding:0 1.5rem;min-height:0}
  .wiz-foot{flex-shrink:0;padding:.75rem 1.5rem 1.1rem;border-top:1px solid #E5E7EB;background:#fff}
  .wiz-steps{display:flex;gap:6px;margin-bottom:1.25rem}
  .wiz-steps div{flex:1;height:4px;border-radius:2px;background:#E5E7EB;transition:background .25s}
  .wiz-steps div.done{background:#3B7DD8}
  .wiz-title{font-size:1.25rem;font-weight:800;color:#1B2A4A;margin-bottom:.3rem}
  .wiz-sub{font-size:.83rem;color:#6B7280;margin-bottom:1.25rem;line-height:1.5}
  .field{margin-bottom:1rem}
  label{display:block;font-size:.72rem;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem}
  input[type=text],input[type=email],input[type=file],select{
    width:100%;padding:.55rem .7rem;border:1px solid #E5E7EB;border-radius:8px;font-size:.87rem;font-family:inherit;background:#fff;color:#111827}
  input:focus,select:focus{outline:none;border-color:#3B7DD8}
  .hint{font-size:.73rem;color:#6B7280;margin-top:.3rem;line-height:1.45}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
  .btn{border-radius:8px;padding:.55rem 1rem;font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid #E5E7EB;background:#fff;color:#374151}
  .btn:hover{background:#F8FAFC}
  .btn-primary{background:#3B7DD8;border-color:#3B7DD8;color:#fff}
  .btn-primary:hover{background:#2F6BC0}
  .btn:disabled{opacity:.55;cursor:default}
  .btn-sm{padding:.4rem .7rem;font-size:.78rem}
  .preset{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
  .preset button{flex:1;min-width:130px;padding:.75rem;border:2px solid #E5E7EB;border-radius:10px;background:#fff;cursor:pointer;font-family:inherit;font-size:.8rem;font-weight:600;color:#111827;text-align:left}
  .preset button:hover,.preset button.sel{border-color:#3B7DD8;background:#EFF6FF}
  .preset span{display:block;font-size:.68rem;font-weight:400;color:#6B7280;margin-top:.2rem}
  .chip-box{display:flex;flex-wrap:wrap;gap:.35rem;padding:.55rem;border:1px solid #E5E7EB;border-radius:8px;min-height:46px;background:#F8FAFC}
  .chip{display:inline-flex;align-items:center;gap:.3rem;background:#DBEAFE;color:#2563EB;border-radius:14px;padding:2px 6px 2px 10px;font-size:.76rem;font-weight:600}
  .chip button{border:none;background:none;color:#2563EB;cursor:pointer;font-size:.85rem;line-height:1;padding:0 2px;opacity:.6}
  .chip button:hover{opacity:1;color:#EF4444}
  /* ── W-02 · LA FICHA ES DONDE SE ESCRIBE ──────────────────────────────────
     Jose, 9/11: *"un botón «+ Add» arriba a la derecha que añada una
     categoría, ubicación, proveedor o proyecto VACÍO, y que el cursor aparezca
     dentro para poder escribir… Así sólo tenemos un lugar donde se muestran
     todas las cosas, en lugar de tener 2 lugares, uno que muestra y otro que
     escribe."*

     Había una caja de texto abajo y una lista de fichas arriba, y lo que
     escribías saltaba de un sitio al otro al pulsar Enter. Dos sitios para una
     cosa. Y encima no se podía CORREGIR una ficha ya puesta —ni una de la
     plantilla— sin borrarla y volver a escribirla entera.

     Ahora la ficha nace donde va a vivir. El recuadro de texto ES la ficha. */
  .chip-inp{border:none;background:transparent;color:inherit;font-family:inherit;font-size:inherit;
    font-weight:inherit;padding:0;margin:0;min-width:2ch;outline:none}
  .chip-inp::placeholder{color:#93C5AE;opacity:1}
  .chip:focus-within{box-shadow:0 0 0 2px #3B7DD8}
  /* La repetida se enciende un momento y vuelve a su color: dice DÓNDE está la
     que choca, que es lo que el mensaje de texto por sí solo no puede decir. */
  .chip-dup{background:#FEE2E2 !important;color:#B91C1C !important;transition:background .2s,color .2s}
  .chip-dup .chip-inp{color:#B91C1C !important}
  .list-hd{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.3rem}
  .list-hd label{margin:0}
  .btn-add{border:1px dashed #3B7DD8;background:#fff;color:#3B7DD8;border-radius:8px;
    padding:.25rem .6rem;font-size:.75rem;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}
  .btn-add:hover{background:#EFF6FF}
  .gen{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
  .userrow{display:grid;grid-template-columns:1fr 115px 28px 24px;gap:.4rem;margin-bottom:.45rem;align-items:center}
  .uicon{border:none;background:none;cursor:pointer;font-size:.95rem;padding:0;line-height:1;color:#6B7280}
  .uicon:hover{color:#3B7DD8}
  .uicon.urm{color:#EF4444}
  .userdone{background:#F8FAFC;border:1px solid #E5E7EB;border-radius:10px;padding:.65rem .9rem;font-size:.83rem;margin-bottom:.45rem;display:flex;align-items:center;gap:.5rem}
  .userdone b{color:#1B2A4A}
  .userdone-acts{margin-left:auto;display:flex;gap:.35rem;flex-shrink:0}
  .summary{background:#F8FAFC;border-radius:10px;padding:.9rem 1.05rem;font-size:.83rem;line-height:1.85}
  .summary b{color:#1B2A4A}
  .toggle{display:flex;align-items:flex-start;gap:.55rem;padding:.7rem;background:#D1FAE5;border-radius:8px;font-size:.83rem;margin-bottom:1rem}
  .err{color:#EF4444;font-size:.8rem;margin-top:.5rem;min-height:1.1em}
  .steps-list{font-size:.83rem;line-height:1.9;background:#F8FAFC;border-radius:10px;padding:1rem 1.1rem;margin-bottom:1rem}
  .steps-list b{color:#1B2A4A}
  .steps-list code{background:#E5E7EB;border-radius:4px;padding:1px 5px;font-size:.78rem}
  .link-box{display:flex;gap:.5rem;align-items:center;background:#D1FAE5;border-radius:8px;padding:.7rem .9rem;margin-top:.75rem}
  .link-box input{flex:1;border:none;background:transparent;font-size:.82rem;color:#065F46;font-family:monospace}
  .btn-copy{transition:background-color .25s ease,color .25s ease,border-color .25s ease}
  .btn-copy.copied{background:#059669;border-color:#059669;color:#fff}
  .warn-box{background:#FEF3C7;border:1px solid #FCD34D;border-radius:8px;padding:.7rem .85rem;font-size:.82rem;color:#111827;line-height:1.5;margin-top:.75rem}
  .warn-box code{background:#FDE68A;border-radius:4px;padding:0 4px}
  .guess{margin-top:.5rem;font-size:.75rem;color:#6B7280}
  .guess-url{font-family:monospace;font-size:.72rem;word-break:break-all;color:#374151}
  .wiz-progress{margin-top:1.1rem}
  .wiz-progress-track{height:8px;border-radius:4px;background:#E5E7EB;overflow:hidden}
  .wiz-progress-fill{height:100%;width:0%;background:#3B7DD8;border-radius:4px;transition:width .3s ease}
  .wiz-progress-label{font-size:.76rem;color:#6B7280;margin-top:.45rem;text-align:center}
</style>
</head>
<body>
  <div class="wiz-head">
    <div class="wiz-steps" id="wSteps"></div>
    <div class="wiz-title" id="wTitle"></div>
    <div class="wiz-sub" id="wSub"></div>
  </div>
  <div class="wiz-scroll"><div id="wBody"></div></div>
  <div class="wiz-foot">
    <div class="err" id="wErr"></div>
    <div class="nav" style="margin-top:.35rem">
      <button class="btn btn-sm" id="wBack" onclick="wGo(-1)">← Back</button>
      <div style="display:flex;gap:.5rem;align-items:center">
        <button class="btn btn-sm" id="wSkip" onclick="wGo(1,true)">Skip for now</button>
        <button class="btn btn-primary btn-sm" id="wNext" onclick="wGo(1)">Continue →</button>
      </div>
    </div>
  </div>

<script>
function _he(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function _escAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function _err(msg){ document.getElementById('wErr').textContent = msg || ''; }
function getBase64(file){
  return new Promise(function(res,rej){
    var r = new FileReader();
    r.readAsDataURL(file);
    r.onload = function(){ res(r.result.split(',')[1]); };
    r.onerror = rej;
  });
}

var CATEGORY_PRESETS = {
  glass: ['WINDOW','SCREEN','WINDOW_PARTS','SHOWER','MIRROR','STOREFRONT','IGU','FLASHING','HARDWARE'],
  build: ['LUMBER','DRYWALL','PAINT','PLUMBING','ELECTRICAL','FASTENERS','TOOLS','INSULATION'],
  blank: []
};

var STEPS = [
  { key:'company',   title:'Your company',           sub:'This name appears in the app header, the browser tab, and the emails the system sends.', required:true },
  { key:'categories',title:'What do you store?',     sub:'Material types. Pick a starting point, then add or remove — you can change these later.', required:false },
  { key:'locations', title:'Where do you store it?', sub:'Racks, shelves, trucks, yards. This matters most: it is what every movement asks for.', required:true },
  { key:'users',     title:'Who works here?',        sub:'Only people on this list can open the system.', required:true },
  { key:'extras',    title:'Suppliers & projects',   sub:'Optional. The app will offer to add these the first time you type one.', required:false },
  { key:'publish',   title:'One last step',          sub:'', required:true }
];

var step = 0;
var skipped = {};
var W = { companyName:'', companyDomain:'', adminName:'', adminEmail:'', logo:null,
  categories:[], locations:[], suppliers:[], projects:[], users:[], enableBackup:true };
var savedOk = false;

function go(dir, skip){
  _err('');
  if (dir > 0 && !skip && !validate()) return;
  if (skip) skipped[STEPS[step].key] = true; else if (dir > 0) delete skipped[STEPS[step].key];
  collect();
  step = Math.max(0, Math.min(STEPS.length - 1, step + dir));
  render();
}
function wGo(dir, skip){ go(dir, skip); }

function collect(){
  /* Las fichas que se quedaron en blanco se van aquí, que es el momento en que
     el paso deja de estar a la vista. Jose: *"si se añade algo y no se escribe
     nada, al pasar de página o salir simplemente se borra y ya."* */
  purgaVacias();
  var k = STEPS[step].key, v = function(id){ var e=document.getElementById(id); return e ? e.value.trim() : ''; };
  if (k === 'company'){
    W.companyName = v('wCompany'); W.companyDomain = v('wDomain');
    W.adminName = v('wAdminName'); W.adminEmail = v('wAdminEmail') || W.adminEmail;
  }
  if (k === 'publish'){
    var t = document.getElementById('wBackupToggle');
    if (t) W.enableBackup = t.checked;
  }
}

function validate(){
  var k = STEPS[step].key;
  if (k === 'company' && !(document.getElementById('wCompany')||{}).value.trim()){ _err('Enter your company name.'); return false; }
  if (k === 'locations'){
    /* Se cuentan las que TIENEN NOMBRE, no las fichas: una ficha vacía recién
       añadida no es una ubicación, y dejarla pasar como tal sería el mismo
       engaño que esto viene a quitar. */
    var conNombre = W.locations.filter(function(l){ return _normaliza(l && l.name) !== ''; }).length;
    if (!conNombre){ _err('Add at least one location.'); return false; }
  }
  return true;
}

function render(){
  var s = STEPS[step];
  document.getElementById('wSteps').innerHTML = STEPS.map(function(x,i){ return '<div class="'+(i<=step?'done':'')+'"></div>'; }).join('');
  document.getElementById('wTitle').textContent = s.title;
  document.getElementById('wSub').textContent = s.sub;
  document.getElementById('wBack').style.display = step === 0 ? 'none' : '';
  document.getElementById('wSkip').style.display = (s.required || savedOk) ? 'none' : '';
  var next = document.getElementById('wNext');

  var b = document.getElementById('wBody');

  if (s.key === 'company'){
    next.textContent = 'Continue →'; next.onclick = function(){ go(1); };
    b.innerHTML =
      '<div class="field"><label>Company name *</label>'+
        '<input type="text" id="wCompany" placeholder="e.g. OX Glass Co." value="'+_escAttr(W.companyName)+'"></div>'+
      '<div class="field"><label>Your name</label>'+
        '<input type="text" id="wAdminName" placeholder="e.g. Jose Castro" value="'+_escAttr(W.adminName)+'"></div>'+
      '<div class="field"><label>Administrator email</label>'+
        '<input type="email" id="wAdminEmail" value="'+_escAttr(W.adminEmail)+'">'+
        '<div class="hint">This is you — the account that owns this copy. You get full access and system alerts.</div></div>'+
      '<div class="field"><label>Company email domain (optional)</label>'+
        '<input type="text" id="wDomain" placeholder="your-company.com" value="'+_escAttr(W.companyDomain)+'">'+
        '<div class="hint">Only affects the wording on the sign-in screen. It does <b>not</b> grant access — people still need to be on your user list.</div></div>'+
      '<div class="field"><label>Logo (optional)</label>'+
        '<input type="file" id="wLogo" accept="image/*" onchange="pickLogo(this)">'+
        '<div class="hint">Any size or shape — resized automatically.</div>'+
        '<div id="wLogoPrev" style="margin-top:.4rem"></div></div>';
  }

  else if (s.key === 'categories'){
    next.textContent = 'Continue →'; next.onclick = function(){ go(1); };
    b.innerHTML =
      '<div class="preset">'+
        '<button onclick="preset(\'glass\',this)">🪟 Glass &amp; windows<span>Window, Screen, Mirror, Shower, IGU…</span></button>'+
        '<button onclick="preset(\'build\',this)">🏗 Construction<span>Lumber, Drywall, Paint, Electrical…</span></button>'+
        '<button onclick="preset(\'blank\',this)">⚪ Start empty<span>I will type my own</span></button>'+
      '</div>'+
      '<div class="field">'+ hdLista('Your categories','categories') +
        '<div class="chip-box" id="wCatChips"></div></div>';
    dibujar('categories');
  }

  else if (s.key === 'locations'){
    next.textContent = 'Continue →'; next.onclick = function(){ go(1); };
    b.innerHTML =
      '<div class="field"><label>Generate a rack grid</label>'+
        '<div class="gen">'+
          '<input type="text" id="wRows" placeholder="Rows: A-F" value="A-F">'+
          '<input type="text" id="wLevels" placeholder="Levels: 1-6" value="1-6">'+
          '<input type="text" id="wSides" placeholder="Sides: A,B,C" value="A,B,C">'+
        '</div>'+
        '<button class="btn btn-sm" style="margin-top:.55rem" onclick="genLocs()">Generate</button>'+
        '<div class="hint">Produces names like A1A, A1B, A1C, A2A… Or just type your own below.</div></div>'+
      /* UN SOLO RECUADRO para estantes y camiones. Antes los camiones tenían
         su propia caja de texto abajo pero aparecían ARRIBA, en la misma lista
         que los estantes: escribías en un sitio y salía en otro. Ahora los dos
         botones añaden a la misma lista, cada uno con su tipo, y el camión se
         distingue por el 🚚 y su color, que es como ya se dibujaba. */
      '<div class="field">'+
        '<div class="list-hd"><label>Locations (<span id="wLocCount">0</span>)</label>'+
          '<div style="display:flex;gap:.4rem">'+
            '<button type="button" class="btn-add" onclick="addEmpty(\'locations\')">+ Add rack</button>'+
            '<button type="button" class="btn-add" style="border-color:#C2410C;color:#C2410C" '+
              'onclick="addEmpty(\'locations\',\'SITE\')">+ Add truck / site</button>'+
          '</div></div>'+
        '<div class="chip-box" id="wLocChips" style="max-height:190px;overflow-y:auto"></div>'+
        '<div class="hint">A truck or job site is a place material can sit too — it just is not a rack.</div></div>';
    dibujar('locations');
  }

  else if (s.key === 'users'){
    next.textContent = 'Continue →'; next.onclick = function(){ go(1); };
    b.innerHTML =
      '<div class="summary" style="margin-bottom:.9rem"><b>'+_he(W.adminEmail)+'</b> — Administrator (you)</div>'+
      '<div id="wUserRows"></div>'+
      '<button class="btn btn-sm" onclick="addUserRow()">+ Add person</button>'+
      '<div class="hint" style="margin-top:.6rem"><b>Admin</b> — everything.<br><b>Warehouse</b> — records movements.<br><b>View only</b> — cannot change anything.</div>';
    drawUsers();
  }

  else if (s.key === 'extras'){
    next.textContent = 'Continue →'; next.onclick = function(){ go(1); };
    b.innerHTML =
      '<div class="field">'+ hdLista('Suppliers','suppliers') +
        '<div class="chip-box" id="wSupChips"></div></div>'+
      '<div class="field">'+ hdLista('Projects / clients','projects') +
        '<div class="chip-box" id="wProjChips"></div></div>';
    dibujar('suppliers'); dibujar('projects');
  }

  else if (s.key === 'publish'){
    document.getElementById('wSkip').style.display = 'none';
    if (!savedOk){
      next.textContent = 'Save & continue →'; next.onclick = saveSetup;
      b.innerHTML =
        '<div class="toggle"><input type="checkbox" id="wBackupToggle"'+(W.enableBackup?' checked':'')+'>'+
          '<label style="margin:0;font-size:.83rem;color:#111827;font-weight:600">Back up my data automatically every night'+
          '<span style="display:block;font-weight:400;color:#6B7280;font-size:.76rem">A dated copy kept 30 days in your Drive.</span></label></div>'+
        '<div class="summary">'+
          '🏢 <b>'+_he(W.companyName)+'</b><br>📦 <b>'+W.categories.length+'</b> categories<br>'+
          '📍 <b>'+W.locations.length+'</b> locations<br>👥 <b>'+(W.users.length+1)+'</b> people<br>'+
          '🏭 <b>'+W.suppliers.length+'</b> suppliers · <b>'+W.projects.length+'</b> projects</div>'+
        '<div class="wiz-progress" id="wProgressWrap" style="display:none">'+
          '<div class="wiz-progress-track"><div class="wiz-progress-fill" id="wProgressBar"></div></div>'+
          '<div class="wiz-progress-label"><span id="wProgressPct">0%</span> — setting up your system…</div>'+
        '</div>';
    } else {
      renderPublishStep();
    }
  }
}

function pickLogo(inp){
  if (!inp.files || !inp.files[0]) return;
  var f = inp.files[0];
  if (f.size > 8*1024*1024){ _err('That image is very large — pick one under 8 MB.'); return; }
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var MAXW=320, MAXH=120, scale = Math.min(1, MAXW/img.width, MAXH/img.height);
      var w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      var cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var dataUrl = cv.toDataURL('image/png');
      W.logo = { fileData: dataUrl.split(',')[1], fileMimeType:'image/png', fileName:'logo.png' };
      document.getElementById('wLogoPrev').innerHTML = '<img src="'+dataUrl+'" style="max-height:48px;border-radius:6px;background:#F3F4F6;padding:4px">';
    };
    img.onerror = function(){ _err('That file is not a readable image.'); };
    img.src = reader.result;
  };
  reader.onerror = function(){ _err('Could not read that image.'); };
  reader.readAsDataURL(f);
}

function preset(kind, btn){
  W.categories = CATEGORY_PRESETS[kind].slice();
  Array.prototype.forEach.call(btn.parentNode.children, function(b){ b.classList.remove('sel'); });
  btn.classList.add('sel');
  _err('');
  dibujar('categories');
}
/* ═══ UNA SOLA LISTA, Y SE ESCRIBE DENTRO ══════════════════════════════════
 *
 * W-02 y W-03. Las cuatro listas del asistente —categorías, ubicaciones,
 * proveedores y proyectos— pasan por aquí. Antes había dos mecanismos por
 * lista (una caja que escribe y una lista que enseña) y cada uno escrito dos
 * veces; ahora hay uno, escrito una vez.
 *
 * Las ubicaciones llevan tipo (estante o camión/obra) y las otras tres son
 * texto suelto. Eso se resuelve en dos funciones de dos líneas —`_lee` y
 * `_pone`— en vez de tener dos mecanismos paralelos.
 */
function _lee(lista, i){
  return lista === 'locations' ? (W.locations[i] || {}).name || '' : W[lista][i] || '';
}
function _pone(lista, i, v){
  if (lista === 'locations') W.locations[i].name = v; else W[lista][i] = v;
}
function _cajaDe(lista){
  return lista === 'categories' ? 'wCatChips'
       : lista === 'suppliers'  ? 'wSupChips'
       : lista === 'projects'   ? 'wProjChips' : 'wLocChips';
}

/* ── UNA FICHA VACÍA, CON EL CURSOR DENTRO ────────────────────────────────
 * Nace vacía a propósito. Si se deja sin escribir, se va sola al cambiar de
 * paso (`purgaVacias`): pulsar «+ Add» sin querer no deja basura, y no hace
 * falta un botón de cancelar para algo que todavía no es nada. */
function addEmpty(lista, tipo){
  if (lista === 'locations') W.locations.push({ name: '', type: tipo || 'RACK' });
  else W[lista].push('');
  dibujar(lista);
  var box = document.getElementById(_cajaDe(lista));
  if (!box) return;
  var inps = box.querySelectorAll('.chip-inp');
  var ult  = inps[inps.length - 1];
  if (ult){ ult.focus(); ult.scrollIntoView({ block: 'nearest' }); }
}

function rmEntry(lista, i){
  W[lista].splice(i, 1);
  _err('');
  dibujar(lista);
}

/* Lo que se escribe se guarda en MAYÚSCULAS y sin espacios sobrantes, igual
 * que en la app: una categoría es una CLAVE, y `Flashing` y `FLASHING` tienen
 * que ser la misma cosa. El recuadro enseña el resultado en el acto, para que
 * no sea una sorpresa al guardar. */
function _normaliza(v){ return String(v || '').trim().toUpperCase(); }

/* ── W-03 · UN NOMBRE REPETIDO NO SE BORRA EN SILENCIO ────────────────────
 *
 * Jose, 9/11: *"si escribo una ubicación que ya existe, la app debe
 * hacérmelo saber, no sólo no hacer nada. Actualmente doy Enter a una
 * ubicación que ya existe y sólo se borra y no pasa nada."*
 *
 * Y era literal. El código decía:
 *
 *     if (!W.locations.some(x => x.name === v)) W.locations.push(...);
 *     inp.value = '';          // ← esto se ejecutaba SIEMPRE
 *
 * La comprobación protegía el dato bien; lo que estaba mal es que después
 * limpiaba la caja pasara lo que pasara. Desde fuera eso no se distingue de
 * «se tragó lo que escribí», que es la peor forma de acertar: el dato está
 * bien y la persona cree que la app está rota.
 *
 * Tres cosas, y las tres hacen falta:
 *   · NO se borra lo escrito — se queda, con el cursor dentro
 *   · se dice en rojo qué ha pasado
 *   · y se enciende un momento LA QUE YA ESTABA, que es lo único que contesta
 *     «¿dónde está la otra?» — con 53 ubicaciones, el mensaje solo no basta
 */
function _choca(lista, i, v){
  for (var k = 0; k < W[lista].length; k++){
    if (k !== i && _lee(lista, k) === v) return k;
  }
  return -1;
}

function _parpadea(lista, k){
  var box = document.getElementById(_cajaDe(lista));
  if (!box) return;
  var ch = box.querySelectorAll('.chip')[k];
  if (!ch) return;
  ch.scrollIntoView({ block: 'nearest' });
  ch.classList.add('chip-dup');
  setTimeout(function(){ ch.classList.remove('chip-dup'); }, 1600);
}

var UNO = { categories:'category', locations:'location', suppliers:'supplier', projects:'project' };

/* Al salir del recuadro. Vacío se deja estar —se irá solo al cambiar de paso—
 * y repetido se queda escrito, con el aviso y el parpadeo. */
function commitChip(lista, i, inp){
  var v = _normaliza(inp.value);
  if (!v){ _pone(lista, i, ''); return; }

  var k = _choca(lista, i, v);
  if (k !== -1){
    _err('"' + v + '" is already on the list — try another ' + (UNO[lista] || 'name') + '.');
    inp.value = v;          // NO se borra lo que escribió
    _parpadea(lista, k);
    return;
  }

  _err('');
  _pone(lista, i, v);
  inp.value = v;            // se ve el resultado: lo que se guarda y lo que se lee son lo mismo
  inp.size  = Math.max(2, v.length);
}

/* Enter añade la siguiente, que es lo que la mano espera al escribir una
 * lista. Escape deja la ficha vacía y por tanto la borra al salir del paso. */
function teclaChip(ev, lista, i, inp){
  if (ev.key === 'Enter'){
    ev.preventDefault();
    commitChip(lista, i, inp);
    if (_lee(lista, i)) addEmpty(lista, lista === 'locations' ? W.locations[i].type : null);
  } else if (ev.key === 'Escape'){
    inp.value = '';
    _pone(lista, i, '');
    _err('');
    inp.blur();
  }
}

/* Las que quedaron vacías se van sin preguntar. Es lo que Jose pidió: *"si se
 * añade algo y no se escribe nada, al pasar de página o salir simplemente se
 * borra y ya."* */
function purgaVacias(){
  ['categories','suppliers','projects'].forEach(function(l){
    W[l] = W[l].filter(function(v){ return _normaliza(v) !== ''; });
  });
  W.locations = W.locations.filter(function(l){ return _normaliza(l && l.name) !== ''; });
}

function dibujar(lista){
  var box = document.getElementById(_cajaDe(lista));
  if (!box) return;
  var n = lista === 'locations' ? W.locations.length : W[lista].length;

  var c = document.getElementById('wLocCount');
  if (c && lista === 'locations') c.textContent = W.locations.length;

  if (!n){
    box.innerHTML = '<span style="color:#6B7280;font-size:.78rem">Nothing yet — press <b>+ Add</b></span>';
    return;
  }

  var piezas = [];
  for (var i = 0; i < n; i++){
    var v    = _lee(lista, i);
    var site = lista === 'locations' && W.locations[i].type === 'SITE';
    var ph   = site ? 'TRUCK 1' : (UNO[lista] || 'name').toUpperCase();
    piezas.push(
      '<span class="chip"' + (site ? ' style="background:#FED7AA;color:#C2410C"' : '') + '>' +
        (site ? '🚚 ' : '') +
        '<input class="chip-inp" value="' + _escAttr(v) + '" placeholder="' + _escAttr(ph) + '"' +
          ' size="' + Math.max(2, (v || ph).length) + '"' +
          ' oninput="this.size=Math.max(2,this.value.length||2)"' +
          ' onblur="commitChip(\'' + lista + '\',' + i + ',this)"' +
          ' onkeydown="teclaChip(event,\'' + lista + '\',' + i + ',this)">' +
        '<button type="button" onclick="rmEntry(\'' + lista + '\',' + i + ')">×</button>' +
      '</span>');
  }
  box.innerHTML = piezas.join('');
}

/* La cabecera de cada lista: su nombre a la izquierda y «+ Add» a la derecha,
 * que es donde Jose lo pidió y donde ya está en la app. */
function hdLista(texto, lista, tipo, idExtra){
  return '<div class="list-hd"><label>' + texto + '</label>' +
    '<button type="button" class="btn-add" ' + (idExtra ? 'id="' + idExtra + '" ' : '') +
      'onclick="addEmpty(\'' + lista + '\'' + (tipo ? ',\'' + tipo + '\'' : '') + ')">+ Add</button></div>';
}

function expand(spec){
  spec = String(spec||'').trim().toUpperCase(); if (!spec) return [];
  if (spec.indexOf(',') !== -1) return spec.split(',').map(function(s){return s.trim();}).filter(Boolean);
  var m = spec.match(/^([A-Z0-9])\s*-\s*([A-Z0-9])$/);
  if (!m) return [spec];
  var a=m[1], z=m[2], out=[];
  if (/[0-9]/.test(a) && /[0-9]/.test(z)) { for (var n=+a;n<=+z;n++) out.push(String(n)); }
  else { for (var c=a.charCodeAt(0);c<=z.charCodeAt(0);c++) out.push(String.fromCharCode(c)); }
  return out;
}
function genLocs(){
  var rows = expand(document.getElementById('wRows').value);
  var lvls = expand(document.getElementById('wLevels').value);
  var sides = expand(document.getElementById('wSides').value);
  if (!rows.length || !lvls.length){ _err('Fill in at least rows and levels.'); return; }
  if (!sides.length) sides = [''];
  /* Generar una rejilla SÍ se salta las repetidas sin decir nada, y aquí eso
     es lo correcto: nadie teclea A1A..D4C a mano, se pide una rejilla entera y
     lo que ya estaba simplemente ya está. Lo que sí se dice es CUÁNTAS se
     quedaron fuera, para que un «Generate» que no cambia nada no parezca
     roto. */
  var puestas = 0, repes = 0;
  rows.forEach(function(r){ lvls.forEach(function(l){ sides.forEach(function(s2){
    var name = r+l+s2;
    if (W.locations.some(function(x){ return x.name === name; })) { repes++; return; }
    W.locations.push({ name: name, type: 'RACK' });
    puestas++;
  }); }); });
  _err(repes && !puestas
        ? 'Those ' + repes + ' are already on the list — nothing new to add.'
        : '');
  dibujar('locations');
}
/* `addLoc`, `rmLoc` y `drawLocs` se fueron con W-02. Eran la tercera y cuarta
 * copia del mismo mecanismo —añadir, quitar y dibujar— escritas aparte sólo
 * porque una ubicación lleva tipo y una categoría no. Ahora esa diferencia
 * vive en dos funciones de dos líneas (`_lee` y `_pone`) y las cuatro listas
 * comparten lo demás. */


function addUserRow(){
  // Sync whatever's already typed in existing rows BEFORE pushing+redrawing —
  // drawUsers() rebuilds every row's HTML from W.users, and without this the
  // email someone just typed (never synced anywhere but the DOM) gets wiped
  // the moment they click "+ Add person" for a second row.
  syncUsers();
  W.users.push({email:'',name:'',role:'WAREHOUSE'});
  _editingUser = W.users.length - 1;
  drawUsers();
}
function rmUser(i){ syncUsers(); W.users.splice(i,1); _editingUser = -1; drawUsers(); }
function syncUsers(){
  W.users.forEach(function(u,i){
    var e = document.getElementById('wU'+i), r = document.getElementById('wR'+i);
    if (e) u.email = e.value.trim(); if (r) u.role = r.value;
  });
}
// People already added are shown the same way the owner is — a settled row, not
// a form field. An always-editable input for every person made a finished list
// look unfinished, and made it impossible to tell at a glance who was actually
// on it. Editing is deliberate now: click ✏️.
var _editingUser = -1;

function drawUsers(){
  var box = document.getElementById('wUserRows'); if (!box) return;
  box.innerHTML = W.users.map(function(u,i){
    var roleLabel = u.role === 'ADMIN' ? 'Administrator' : (u.role === 'VIEWER' ? 'View only' : 'Warehouse');
    if (i !== _editingUser && u.email){
      return '<div class="userdone">'+
        '<b>'+_he(u.email)+'</b> — '+roleLabel+
        '<span class="userdone-acts">'+
          '<button class="uicon" onclick="editUserRow('+i+')" title="Edit">✏️</button>'+
          '<button class="uicon urm" onclick="rmUser('+i+')" title="Remove">×</button>'+
        '</span></div>';
    }
    return '<div class="userrow">'+
      '<input type="email" id="wU'+i+'" placeholder="name@company.com" value="'+_escAttr(u.email)+'" '+
      'onkeydown="if(event.key===\'Enter\'){event.preventDefault();commitUserRow('+i+')}">'+
      '<select id="wR'+i+'">'+
        '<option value="WAREHOUSE"'+(u.role==='WAREHOUSE'?' selected':'')+'>Warehouse</option>'+
        '<option value="ADMIN"'+(u.role==='ADMIN'?' selected':'')+'>Admin</option>'+
        '<option value="VIEWER"'+(u.role==='VIEWER'?' selected':'')+'>View only</option>'+
      '</select>'+
      '<button class="uicon" onclick="commitUserRow('+i+')" title="Done">✓</button>'+
      '<button class="uicon urm" onclick="rmUser('+i+')" title="Remove">×</button></div>';
  }).join('');
  var open = document.getElementById('wU' + (_editingUser >= 0 ? _editingUser : W.users.length - 1));
  if (open) open.focus();
}

function editUserRow(i){ syncUsers(); _editingUser = i; drawUsers(); }

function commitUserRow(i){
  syncUsers();
  var u = W.users[i];
  if (!u) return;
  if (!u.email || u.email.indexOf('@') === -1){
    _err('Enter a full email address, like name@company.com');
    return;
  }
  _err('');
  _editingUser = -1;
  drawUsers();
}

function saveSetup(){
  collect();
  syncUsers();
  W.users = W.users.filter(function(u){ return u.email && u.email.indexOf('@') !== -1; });
  var next = document.getElementById('wNext');
  next.disabled = true; next.textContent = 'Setting up…';
  document.getElementById('wSkip').style.display = 'none';
  document.getElementById('wBack').style.display = 'none';

  // There's no way to get real incremental progress out of a single Apps
  // Script call (it's one synchronous round trip, all-or-nothing) — so this
  // is a deliberately-honest approximation, not a lie dressed up as real
  // progress: it eases toward 90% and never claims done until the call
  // actually returns, then snaps straight to 100%.
  var wrap = document.getElementById('wProgressWrap');
  var bar  = document.getElementById('wProgressBar');
  var pct  = document.getElementById('wProgressPct');
  if (wrap) wrap.style.display = '';
  var progress = 0;
  var ticker = setInterval(function(){
    progress = Math.min(90, progress + (90 - progress) * 0.15 + 1);
    if (bar) bar.style.width = progress + '%';
    if (pct) pct.textContent = Math.round(progress) + '%';
  }, 300);

  google.script.run
    .withSuccessHandler(function(){
      clearInterval(ticker);
      if (bar) bar.style.width = '100%';
      if (pct) pct.textContent = '100%';
      savedOk = true;
      next.disabled = false;
      setTimeout(render, 300); // let the 100% fill paint before switching screens
    })
    .withFailureHandler(function(err){
      clearInterval(ticker);
      if (wrap) wrap.style.display = 'none';
      document.getElementById('wSkip').style.display = '';
      document.getElementById('wBack').style.display = '';
      next.disabled = false; next.textContent = 'Save & continue →';
      _err('Setup failed: ' + ((err && err.message) || err));
    })
    .saveSetupWizard(W);
}

function renderPublishStep(){
  document.getElementById('wSteps').innerHTML = STEPS.map(function(x,i){ return '<div class="done"></div>'; }).join('');
  document.getElementById('wTitle').textContent = 'One last step — publish your app';
  document.getElementById('wSub').textContent = 'This is the only technical step, and only the owner (you) does it, once.';
  var next = document.getElementById('wNext');
  next.textContent = "✓ I did it — show my link"; next.onclick = checkLink;
  document.getElementById('wBack').style.display = 'none';
  document.getElementById('wSkip').style.display = 'none';
  document.getElementById('wBody').innerHTML =
    '<div class="steps-list">'+
      '<b>1.</b> First, name your project: top-left of the Apps Script editor, click <b>"Untitled project"</b> and type your company name — this is what your team sees on the permission screen.<br>'+
      '<b>2.</b> Menu bar above: <b>Extensions → Apps Script</b> (opens in a new tab — this tab stays open, come back to it later)<br>'+
      '<b>3.</b> Top right, blue button: <b>Deploy → New deployment</b><br>'+
      '<b>4.</b> Click the ⚙️ gear next to "Select type" → choose <b>Web app</b><br>'+
      '<b>5.</b> Set <b>Execute as: Me</b>, and <b>Who has access: Anyone with a Google account</b><br>'+
      '<b>6.</b> Click <b>Deploy</b>, then <b>Authorize access</b> and approve the permissions<br>'+
      '<b>7.</b> Google now shows a <b>Web app URL</b> ending in <code>/exec</code>. <b>Copy it</b> before closing that box — it is the address of your system.<br>'+
      '<b>8.</b> Come back to this tab and click the button below'+
    '</div>'+
    '<div class="hint">You may see "Google hasn\'t verified this app" — that is expected for software you just installed for yourself. Click <b>Advanced</b>, then <b>Go to (your project name)</b> to continue. You may also see a note about a missing Privacy Policy link — also expected, and not something you need to fix.</div>'+
    '<div id="wLinkResult"></div>'+
    '<div style="margin-top:1.1rem;text-align:center"><a href="#" onclick="reconfigure();return false;" style="font-size:.78rem;color:#6B7280">Need to change something you already entered? Reconfigure</a></div>';
}

// Reached this dialog after setup was already saved — either earlier in this
// same session (just finished all 5 steps) or on reopening the dialog later
// (which used to restart the whole wizard from a blank slate, discarding
// nothing on the SHEET but making it look like everything had to be re-typed,
// and risking a genuine wipe if the customer clicked through without
// re-entering categories/locations — see the guards in saveSetupWizard).
// Skips straight to the one step that can still be pending: publishing.
function showAlreadyConfigured(){
  savedOk = true;
  step = STEPS.length - 1;
  renderPublishStep();
}

function reconfigure(){
  savedOk = false;
  step = 0;
  render();
}

function checkLink(){
  var next = document.getElementById('wNext');
  next.disabled = true; next.textContent = 'Checking…';
  google.script.run
    .withSuccessHandler(function(res){
      next.disabled = false; next.textContent = "✓ I did it — show my link";
      var box = document.getElementById('wLinkResult');
      // A SAVED link is the owner's own answer and is simply correct.
      // A DETECTED one is not: Apps Script's getUrl() is known to report a
      // deployment that was never published, so the URL it hands back 404s
      // (Google issue 170799249). Showing that as "your link" is what sent the
      // last round chasing a dead address, so it is now presented as a guess to
      // be checked against what Google actually displayed, with the paste box
      // already open rather than hidden behind a link.
      if (res && res.url && res.saved){
        box.innerHTML =
          '<div class="link-box"><input type="text" id="wLinkUrl" readonly value="'+_escAttr(res.url)+'" onclick="this.select()">'+
          '<button class="btn btn-sm btn-copy" onclick="copyLink(document.getElementById(\'wLinkUrl\').value,this)">Copy</button></div>'+
          '<div class="hint">✓ Saved. This is your system’s permanent address — bookmark it and share it with your team.<br>'+
            'Wrong one? <a href="#" onclick="showLinkOverride();return false;" style="color:#3B7DD8">✏️ Paste a different link</a></div>'+
          '<div id="wLinkOverride" style="display:none;margin-top:.6rem">'+
            '<input type="text" id="wLinkOverrideInput" placeholder="https://script.google.com/…/exec">'+
            '<button class="btn btn-sm" style="margin-top:.4rem" id="wLinkOverrideBtn" onclick="applyLinkOverride()">Save this link</button>'+
          '</div>'+
          '<button class="btn btn-primary" style="margin-top:.9rem;width:100%" onclick="google.script.host.close()">Done — close this window</button>';
      } else {
        box.innerHTML =
          '<div class="warn-box">' +
            '<b>Paste the link Google gave you</b><br>' +
            'The Web app URL from step 7, ending in <code>/exec</code>.' +
            (res && res.url
              ? '<div class="guess">Apps Script reports this one, but it is often the wrong deployment — compare it before using it:<br>' +
                '<span class="guess-url">' + _he(res.url) + '</span></div>'
              : '') +
          '</div>' +
          '<div id="wLinkOverride" style="margin-top:.6rem">'+
            '<input type="text" id="wLinkOverrideInput" placeholder="https://script.google.com/…/exec">'+
            '<button class="btn btn-primary btn-sm" style="margin-top:.4rem" id="wLinkOverrideBtn" onclick="applyLinkOverride()">Save this link</button>'+
          '</div>';
      }
    })
    .withFailureHandler(function(){
      next.disabled = false; next.textContent = "✓ I did it — show my link";
      _err('Could not check — try again.');
    })
    .checkDeploymentReady();
}
// On a Sheet copied from an already-deployed one, ScriptApp.getService().getUrl()
// can hand back a URL built from the ORIGINAL script's deployment — a dead link,
// on a copy that has no deployment of its own. The owner can see the real URL in
// Google's Deploy dialog, so let them correct it, and PERSIST that correction
// server-side (Script Properties) so it survives closing the wizard. An earlier
// version only patched the textbox, which is why reopening setup showed the same
// dead link all over again.
function showLinkOverride(){
  var el = document.getElementById('wLinkOverride');
  if (el) el.style.display = '';
}
function applyLinkOverride(){
  var v = (document.getElementById('wLinkOverrideInput').value||'').trim();
  if (!v) return;
  var btn = document.getElementById('wLinkOverrideBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  _err('');
  google.script.run
    .withSuccessHandler(function(){
      // Re-read from the server rather than trusting the local value, so the
      // screen shows exactly what was stored.
      checkLink();
    })
    .withFailureHandler(function(e){
      if (btn){ btn.disabled = false; btn.textContent = 'Save this link'; }
      _err((e && e.message) || 'Could not save that link.');
    })
    .saveWebAppUrl(v);
}

var _copyResetTimer = null;
function copyLink(url, btn){
  var inp = document.createElement('input'); inp.value = url;
  document.body.appendChild(inp); inp.select(); document.execCommand('copy'); document.body.removeChild(inp);
  if (!btn) return;
  // Swap to a checkmark for 2s, then fade back — the CSS transition on
  // .btn-copy (background/color) is what makes both the in and the out feel
  // smooth instead of an instant flip in either direction.
  clearTimeout(_copyResetTimer);
  var original = btn.dataset.label || btn.textContent;
  btn.dataset.label = original;
  btn.textContent = '✓ Copied';
  btn.classList.add('copied');
  _copyResetTimer = setTimeout(function(){
    btn.textContent = original;
    btn.classList.remove('copied');
  }, 2000);
}

// Bootstrap. Two jobs: pre-fill the admin email with whoever this dialog is
// running as, and — the important one — check whether setup was already
// completed (possibly in an earlier opening of this same dialog) so reopening
// resumes at publishing instead of silently restarting data entry from zero.
google.script.run.withSuccessHandler(function(state){
  if (state && state.ownerEmail) W.adminEmail = state.ownerEmail;
  if (state && state.needsSetup === false) { showAlreadyConfigured(); return; }
  render();
}).withFailureHandler(function(){ render(); }).getSetupState();
</script>
